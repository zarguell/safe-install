name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            binary_name: safe-install-linux
          - os: macos-latest
            binary_name: safe-install-darwin
          - os: windows-latest
            binary_name: safe-install.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            go build -o ${{ matrix.binary_name }}
          else
            go build -o ${{ matrix.binary_name }}
          fi
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}