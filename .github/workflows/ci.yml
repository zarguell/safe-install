name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.21', '1.22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v -cover

      - name: Run tests with race detector
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.22'
        run: go test ./... -race -short

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run go vet
        run: go vet ./...

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Please run 'gofmt -s .'"
            exit 1
          fi

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            binary_name: safe-install-linux
          - os: macos-latest
            binary_name: safe-install-darwin
          - os: windows-latest
            binary_name: safe-install.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            go build -ldflags="-s -w" -o ${{ matrix.binary_name }}
          else
            go build -ldflags="-s -w" -o ${{ matrix.binary_name }}
          fi
        shell: bash

      - name: Verify binary
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./${{ matrix.binary_name }} --help
          else
            ./${{ matrix.binary_name }} --help
          fi
        shell: bash